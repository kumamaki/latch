name: CI

# Push only. A self-hosted runner on a public repo would run a pull
# request's code on the mini, and a fork controls the workflow file that
# would guard against it.
on:
  push:
    branches: [main]

# Cancel superseded runs of one ref. The mini serializes jobs on its single
# runner, so a stale run would only delay the current one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (mini)
    runs-on: [self-hosted, macOS, mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Check
        run: just check
