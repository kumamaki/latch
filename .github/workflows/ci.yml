name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of one ref. The mini serializes jobs on its single
# runner, so a stale run would only delay the current one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (mini)
    # The mini is a self-hosted runner on a public repo: a fork's pull
    # request would run its code here. Only pushes and same-repo pull
    # requests reach it.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, mini]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Check
        run: just check
