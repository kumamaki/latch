name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Install just and ShellCheck
        run: brew install just shellcheck
      - name: Check
        run: just check
